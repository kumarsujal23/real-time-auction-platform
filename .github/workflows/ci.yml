name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff==0.6.9
          ruff check app tests

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://auction:auction@localhost:5432/auction_test_db
          DATABASE_URL: postgresql+asyncpg://auction:auction@localhost:5432/auction_test_db
          REDIS_URL: redis://localhost:6379/0
          ENV: test
        run: pytest -v --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
